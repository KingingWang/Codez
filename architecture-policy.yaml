global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json

exceptions:
  - id: session-features-attribution-header-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/adapters/src/model/runner-attribution.ts ]
    reason: 已准入的归因头构造器只追加 x-codez-session-features（docs/design/v2/model/session-features-header.md）；它仍是全部归因头的唯一写入点，签名与模块边界不变，接管整个 adapters 包不在本次范围内。
  - id: session-features-workflow-command-pattern-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/core/src/runtime/methods/dynamic-workflow-activation.ts ]
    reason: 已准入的动态工作流激活只导出既有 `/workflow` 历史判据常量，供 session-features 的历史推导复用同一判据；激活行为、owner 与模块边界不变。
  - id: node-repl-call-ledger-cua-bridge-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/node-repl-host/src/cua-bridge.ts ]
    reason: 已准入的 node_repl CUA bridge 只删去 Worker 侧的会话信息构造与目标应用身份记录，二者移到主线程 CUA broker（apps/codez-cli/docs/design/v2/tool/20-node-repl-call-ledger.md）；subagent 拒绝与对模型的行为不变，接管整个 node-repl-host 包不在本次范围内。
  - id: node-repl-call-ledger-cua-broker-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/node-repl-host/src/cua-broker.ts ]
    reason: 已准入的 node_repl CUA broker 改为只认 node-repl-call-ledger 签发的本次调用 token，按账本条目构造会话信息并把目标应用身份记进账本（20-node-repl-call-ledger.md「CUA broker」）；MR !3207 再在 token 校验之后把会话能力标签用的 computerUse 记进账本（docs/design/v2/model/session-features-header.md）；runtime 调用与响应格式不变。
  - id: node-repl-call-ledger-result-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/node-repl-host/src/result.ts ]
    reason: 已准入的 node_repl 结果组装改为只从账本 facts 取可信 key，忽略 Worker 结果消息里的同名字段（20-node-repl-call-ledger.md「结果组装」）；MR !3207 按同样处置追加 codez/nodeReplBrowserUse、codez/nodeReplComputerUse 两个 key（docs/design/v2/model/session-features-header.md）；结果内容与其他 meta 处置不变。
  - id: offpeak-expiration-codes-existing-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/core/src/runtime/off-peak/model-binding.ts ]
    reason: 已准入的闲时请求包装器仅复用共享错误码判断，补齐 3106 运行超时的既有生命周期通知；不改变 owner、控制协议或模块边界，不扩展为整个 CLI runtime 目录接管。
  - id: multi-cursor-badge-title-passthrough-edit
    rule: unmanaged-new-file
    paths:
      - apps/codez-cli/packages/node-repl-host/src/cua-broker.ts
    reason: 已准入的 node_repl CUA broker 仅增透传可选 actionTitle 字段（node_repl cell title → badge 文字，docs/cua/producer/multi-session-cursor-overlay-spec.md §4.8）——cua-broker 按 ledger meta 构建的 requestContext 注入、parseContext 白名单补字段；签名、broker 形态与模块边界不变，不接管 codez-cli 目录。
  - id: side-pane-full-view-shortcut-command-edit
    rule: unmanaged-new-file
    paths: [ packages/shared/src/shortcutCommands.ts ]
    reason: 已准入的快捷键命令表只追加一条 toggleSidePaneFullView 命令（Side Pane 完整视图，docs/ui/side-pane-full-view.md）；命令表仍是唯一数据源，签名与模块边界不变，接管整个 shared 包不在本次范围内。
  - id: codez-site-deploy-runtime-template
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/codez-site-plugin/skills/site-deploy/templates/static-server.mjs ]
    reason: site-deploy 技能复制进用户部署包的静态站服务器模板，只在 Sites runner 的容器里由 start.sh 执行；仓库代码不 import 它，也不属于任何运行时模块。同目录的 start.sh 模板是 shell，不受本规则约束。
  - id: opensource-cua-test-project-config
    rule: unmanaged-new-file
    paths: [ packages/codez-cua/vitest.config.ts ]
    reason: 该文件只装配测试项目，开源占位版本用于保持根单测入口可运行；不包含 producer 运行逻辑，不为同目录实现文件开放例外。
  - id: project-location-cache-recovery-existing-edit
    rule: unmanaged-new-file
    paths:
