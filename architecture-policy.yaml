      - packages/shared/src/project-access-token-client.ts
      - packages/services/src/model-provider/accountProjectTokenClient.ts
      - packages/services/src/credential/credentialService.ts
    reason: 已有项目 Token 与凭据存储增加派生缓存的局部恢复端口，并把换证请求失败按固定类别分码（ZCT-2111046389485834240）；保持原有 owner 和共享文件锁，不接管全目录。
  - id: test-ids-subpath-import-unmanaged-edit
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/browser-use/EmbeddedBrowserPermissionPrompts.tsx
      - packages/ui/src/hooks/useStartPlanRecommendation.ts
      - packages/ui/src/settings/DynamicWorkflowModeSetting.tsx
    reason: 已准入的存量文件只把 TID 导入从 @codez/shared 根入口改为 @codez/shared/test-ids 子路径（根入口不再导出 test-ids，以收窄受影响单测范围）；行为与模块边界不变，接管 ui 目录不在本次范围内。
  - id: settings-personalization-section-new-file
    rule: unmanaged-new-file
    paths: [ packages/ui/src/settings/PersonalizationSection.tsx ]
    reason: 个性化设置分区组件只编排 ISettingService 的 getUserInstructions/saveUserInstructions 与既有设置页 UI 原语（spec：docs/ui/settings-personalization.md）；读写唯一事实源在服务层，不新增平行状态，接管整个 ui 目录不在本次范围内。
  - id: settings-personalization-size-constant-new-file
    rule: unmanaged-new-file
    paths: [ packages/shared/src/userInstructions.ts ]
    reason: 用户自定义指令字节上限共享常量（与 CLI 读取截断对齐，spec：docs/ui/settings-personalization.md），服务层校验与 UI 计数共用同一数值；仅两个常量导出，接管整个 shared 目录不在本次范围内。
  - id: remote-workspace-admission-deadline-existing-edit
    rule: unmanaged-new-file
    paths: [ packages/desktop/src/host/remoteWorkspacePreparation.ts ]
    reason: 已准入的远程项目目录 admission 只增加 30 秒截止时间和可重试的无响应错误码（3.16.2 远端回归 R8，docs/remote/project-first-remote-navigation-spec.md §2.4）；owner、调用方与模块边界不变，接管 desktop host 目录不在本次修复范围内。
  - id: gen-ui-existing-capability-check
    rule: unmanaged-new-file
    paths: [ packages/services/src/codez-agent/independentPlanSupport.ts ]
    reason: 在已存在的 CLI 能力查询入口补充 GenUI 上下文能力检查，防止旧 CLI 静默丢弃状态；保持既有 services/agent 边界，不扩展本次修复为整个 codez-agent 模块接管。
  - id: connection-log-secret-token-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ packages/shared/src/source-server/connectionLog.ts ]
    reason: 已存在的连接日志过滤函数只把已知秘密从子串替换改为完整 token 匹配，修复短密码反推泄露；签名与模块边界不变，接管整个 shared 包不在本次修复范围内。
  - id: connection-errors-econnreset-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ packages/shared/src/source-server/connectionErrors.ts ]
    reason: 已存在的连接错误归一化码表补一项 ECONNRESET → remote-host-unreachable，修复在线断连恢复失败被误报为预检失败；签名与模块边界不变，接管整个 shared 包不在本次修复范围内。
  - id: remote-authentication-unsupported-presentation-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ packages/ui/src/lib/remoteConnectionPresentationErrors.ts ]
    reason: 已存在的远程连接错误展示映射为新增公开码 remote-authentication-unsupported 补一项标题与“查看详情”操作，修复 SSH 二次验证失败被提示为检查密码；签名与模块边界不变，接管 ui 目录不在本次修复范围内。
  - id: source-server-operation-log-level-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ packages/desktop/src/host/sourceServerOperationLogs.ts ]
    reason: 已有连接日志封装透传 TransportContext 已定义的 level，使低版本 glibc 提示保留 warn；Host 仍是唯一日志 owner，签名与模块边界不变，接管整个 desktop 包不在本次范围内。
  - id: client-config-public-field-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ packages/shared/src/clientConfig.ts ]
    reason: Existing upstream public config parser gains one validated recommendation field; ownership and module boundaries remain unchanged, and adopting the shared package is outside this change.
  - id: highspeed-fallback-snapshot-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/core/src/runtime/methods/turn-execution-fallback.ts ]
    reason: 合并已存在于 staging 的加速卡回退模块，仅将可变 Session 读取替换为本轮固定候选；保持现有 Core 模块边界，不在同步分支时机械拆分整个 runtime。
  - id: session-owned-workflow-shutdown-existing-files
    rule: unmanaged-new-file
    paths:
      - apps/codez-cli/packages/bootstrap/src/app/dynamic-workflow-run-submit.ts
      - apps/codez-cli/packages/bootstrap/src/app/workflow-driver-quiescence.ts
    reason: 两个文件已存在于集成基线；本次在既有 bootstrap owner 内补启动关闭互斥和 actor 清理等待，不新增模块或跨层依赖。整个 bootstrap/app 的接管另行治理，生命周期公开模块边界保持不变。
  - id: workflow-quota-auto-resume-unmanaged-file
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/bootstrap/src/app/dynamic-workflow-quota-resume.ts ]
    reason: 额度停止的 run 到点自动续跑，是 run service 旁的一个宿主模块（只读 journal 行、订阅结算、经注入的 resume 续跑）；与同目录的 run service 文件同属未受管的 codez-cli bootstrap，接管该目录需要单独的模块边界整理。
  - id: mcp-node-fallback-unmanaged-file
    rule: unmanaged-new-file
    paths:
      - apps/codez-cli/packages/adapters/src/mcp/node-fallback.ts
      - apps/codez-cli/packages/bootstrap/src/app/mcp-node-fallback.ts
    reason: 桌面 Electron Node 下 stdio MCP 的 node/npm/npx 回退（apps/codez-cli/docs/design/v2/mcp-node-fallback.md）。adapters 文件只负责 shim 目录与子进程 env 合并，经 CreateMcpAdapterOptions.nodeFallback 注入；bootstrap 文件只判定 Electron 并给出随包 npm 候选目录。两者同属未受管的 codez-cli，接管 adapters/mcp 或 bootstrap/app 需要单独的模块边界整理。
  - id: workflow-unrecognized-code-cap-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ apps/codez-cli/packages/adapters/src/model/workflow-model-failure-policy.ts ]
    reason: 已准入的 workflow 模型错误策略表只增加一行（分类器不认识的业务码在同一次请求里连续出现 10 次时停 run）、一个连续计数入参与两个计数纯函数；runner 与 driver 读同一函数的约束与模块边界不变，接管 adapters/model 目录不在本次范围内。
