name: Issue AI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  auto-triage:
    if: >
      github.event_name == 'issues' &&
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: issue-ai-auto
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rate limit check
        id: rate
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "issue-ai.yml",
              event: "issues",
              created: `>=${since}`,
              per_page: 100,
            });
            // 当前运行可能已被查询返回；排除它，避免第 30 次被提前拦截。
            const recent = runs.filter((run) => run.id !== context.runId).length;
            core.setOutput("allow", recent >= 30 ? "false" : "true");
            core.notice(`Auto triage runs in the last 24 hours: ${recent} (limit 30)`);

      - name: Write opencode provider config
        if: steps.rate.outputs.allow == 'true'
        env:
          ISSUE_TRIAGE_API_KEY: ${{ secrets.ISSUE_TRIAGE_API_KEY }}
          ISSUE_TRIAGE_BASE_URL: ${{ secrets.ISSUE_TRIAGE_BASE_URL }}
          ISSUE_TRIAGE_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
        run: |
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          jq -n \
            --arg base "$ISSUE_TRIAGE_BASE_URL" \
            --arg key "$ISSUE_TRIAGE_API_KEY" \
            --arg model "$ISSUE_TRIAGE_MODEL" \
            '{
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                "gateway": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Gateway",
                  "options": { "baseURL": $base, "apiKey": $key },
                  "models": { ($model): { "name": $model } }
                }
              }
            }' > "${XDG_CONFIG_HOME:-$HOME/.config}/opencode/opencode.json"

      - name: Run opencode triage
        if: steps.rate.outputs.allow == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: gateway/${{ secrets.ISSUE_TRIAGE_MODEL }}
          use_github_token: "true"
          share: "false"
          prompt: |
            你是当前仓库的自动 Issue 初筛代理。

            只进行只读调查并发布一条中文 Markdown 评论。绝对不要修改任何文件，不要使用编辑或写入工具，不要执行 git add、git commit、git push，不要创建分支或 Pull Request。

            调查要求：
            1. 阅读仓库根目录 AGENTS.md，以及与问题相关的 spec、README、DESIGN.md、CONTEXT.md。
            2. 检查当前源码、配置、测试和必要的提交历史，不要只根据 Issue 内容猜测。
            3. 判断问题属于 bug、feature、question、docs、CI/build、UI、protocol/sync、performance、security 或 other。
            4. 对 bug 定位当前行为、相关调用链、触发条件和可能根因。
            5. 对 feature 查找已有扩展点、影响模块、边界情况和建议测试。
            6. 所有重要结论都引用文件路径和行号。
            7. 严格区分已确认事实、高概率判断和未验证假设。
            8. 证据不足时标记为“待复现”或“需要补充信息”，不要编造根因。

            评论只输出以下内容：

            ## 初步结论
            说明问题类型、当前判断和确认程度。

            ## 代码定位
            列出最相关的 2-5 个文件、行号、函数或测试。

            ## 原因与影响
            说明当前行为为什么发生，以及可能影响哪些模块、平台或场景。

            ## 建议
            给维护者下一步可执行的调查、修改和测试建议。

            ## 待确认
            列出仍缺少的信息和建议向 Issue 提交者询问的问题。

            不要输出完整扫描过程、无关文件清单或泛泛的“建议增加测试”。
            使用简体中文，评论应简洁、基于证据，并控制在 1500 个中文字符以内。

  manual:
    if: >
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment') &&
      github.event.sender.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: issue-ai-manual-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Write opencode provider config
        env:
          ISSUE_TRIAGE_API_KEY: ${{ secrets.ISSUE_TRIAGE_API_KEY }}
          ISSUE_TRIAGE_BASE_URL: ${{ secrets.ISSUE_TRIAGE_BASE_URL }}
          ISSUE_TRIAGE_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
        run: |
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          jq -n \
            --arg base "$ISSUE_TRIAGE_BASE_URL" \
            --arg key "$ISSUE_TRIAGE_API_KEY" \
            --arg model "$ISSUE_TRIAGE_MODEL" \
            '{
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                "gateway": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Gateway",
                  "options": { "baseURL": $base, "apiKey": $key },
                  "models": { ($model): { "name": $model } }
                }
              }
            }' > "${XDG_CONFIG_HOME:-$HOME/.config}/opencode/opencode.json"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: gateway/${{ secrets.ISSUE_TRIAGE_MODEL }}
          use_github_token: "true"
          share: "false"
          prompt: |
            你是被维护者明确召回的仓库深度调查代理。

            本次任务只允许调查并发表评论，不允许实现修复。不要修改任何文件，不要使用编辑或写入工具，不要执行 git add、git commit、git push，不要创建分支或 Pull Request。

            请把触发评论作为调查范围提示，同时阅读完整的 Issue/PR 描述、已有评论、PR diff、review 意见和相关近期提交。

            调查要求：
            1. 阅读 AGENTS.md，以及相关 spec、README、DESIGN.md、CONTEXT.md。
            2. 追踪完整调用链，而不是只返回关键词命中的文件。
            3. 对 bug 给出期望行为、当前行为、触发条件、最可能根因和复现路径。
            4. 对 feature 给出已有扩展点、推荐修改入口、行为契约、边界情况和实现范围。
            5. 如果环境已有依赖，可以运行直接相关的非破坏性测试；不要安装依赖、修改仓库或运行全量耗时任务。
            6. 检查是否会影响 Desktop、Web、远程链路、协议、状态同步、持久化或其他平台。
            7. 重要结论必须引用文件路径和行号。
            8. 严格区分已确认事实、推测和调查缺口。
            9. 如果触发评论要求“修复”，将其转化为可执行的实现交接建议，不要实际修改代码。

            评论使用以下结构：

            ## 调查结论
            明确说明问题是否已确认、最可能的根因和置信度。

            ## 代码证据
            列出关键文件、行号、调用链、配置或测试证据。

            ## 影响范围
            说明受影响的模块、平台、运行模式、协议、持久化和兼容性。

            ## 实施交接
            给出建议修改的文件/模块、需要保持的行为约束、推荐方案和主要风险。

            ## 验证方案
            列出复现步骤、应新增或运行的测试，以及必要的真实环境验证。

            ## 未决问题
            只列出确实阻塞后续处理的问题和需要补充的信息。

            不要输出无关扫描过程或泛泛建议。评论应成为开发者可以直接据此开始处理的调查交接单，使用简体中文并控制在 3000 个中文字符以内。
