name: Issue AI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  auto:
    if: >
      github.event_name == 'issues' &&
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: issue-ai-auto
      cancel-in-progress: false
    env:
      MODE: auto
      AUTO_MAX_PER_HOUR: "2"
      AUTO_WINDOW_HOURS: "1"
      AUTO_MAX_AGE_MINUTES: "15"
      MAX_TITLE_CHARS: "300"
      MAX_BODY_CHARS: "6000"
      OPENAI_API_KEY: ${{ secrets.ISSUE_TRIAGE_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.ISSUE_TRIAGE_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Analyze issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-ai.cjs');
            await run({ github, context, core, processEnv: process.env });

  manual:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: issue-ai-manual-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      MODE: manual
      ALLOWED_ASSOCIATIONS: "OWNER,MEMBER,COLLABORATOR"
      MAX_TITLE_CHARS: "300"
      MAX_BODY_CHARS: "20000"
      OPENAI_API_KEY: ${{ secrets.ISSUE_TRIAGE_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.ISSUE_TRIAGE_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Analyze
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-ai.cjs');
            await run({ github, context, core, processEnv: process.env });
