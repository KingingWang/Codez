name: Issue AI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  admission:
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'issues' &&
          github.event.action == 'opened' &&
          github.event.issue.pull_request == null
        ) ||
        (
          (
            github.event_name == 'issue_comment' ||
            github.event_name == 'pull_request_review_comment'
          ) &&
          (
            github.event.comment.body == '/oc' ||
            github.event.comment.body == '/opencode' ||
            startsWith(github.event.comment.body, '/oc ') ||
            startsWith(github.event.comment.body, '/opencode ')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allow: ${{ steps.admission.outputs.allow }}
      mode: ${{ steps.admission.outputs.mode }}
    steps:
      - name: Check shared rolling quota
        id: admission
        uses: actions/github-script@v7
        env:
          ISSUE_AI_DAILY_LIMIT: ${{ vars.ISSUE_AI_DAILY_LIMIT }}
        with:
          script: |
            const payload = context.payload;
            const body = payload.comment?.body ?? "";
            const isAuto =
              context.eventName === "issues" &&
              payload.action === "opened" &&
              !payload.issue?.pull_request;
            const isManual =
              (context.eventName === "issue_comment" ||
                context.eventName === "pull_request_review_comment") &&
              /^\/(?:oc|opencode)(?: |$)/u.test(body);

            if (!isAuto && !isManual) {
              core.setFailed("当前事件不包含有效的 Issue AI 触发条件");
              return;
            }

            core.setOutput("mode", isAuto ? "auto" : "manual");

            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT ?? "1");
            if (attempt !== 1) {
              core.setFailed("Issue AI 不允许通过 rerun 重复调用模型");
              return;
            }

            const configured = String(process.env.ISSUE_AI_DAILY_LIMIT ?? "").trim();
            let limit = 30;
            if (configured !== "") {
              if (!/^\d+$/u.test(configured)) {
                core.setFailed("ISSUE_AI_DAILY_LIMIT 必须是非负整数");
                return;
              }
              limit = Number(configured);
              if (!Number.isSafeInteger(limit)) {
                core.setFailed("ISSUE_AI_DAILY_LIMIT 超出安全整数范围");
                return;
              }
            }

            if (limit === 0) {
              core.setOutput("allow", "false");
              core.notice("Issue AI 已由 ISSUE_AI_DAILY_LIMIT=0 禁用");
              core.setFailed("Issue AI quota is disabled");
              return;
            }

            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const events = ["issues", "issue_comment", "pull_request_review_comment"];
            const runPages = await Promise.all(
              events.map((event) =>
                github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "issue-ai.yml",
                  event,
                  created: `>=${since}`,
                  per_page: 100,
                }),
              ),
            );
            const runs = [
              ...new Map(
                runPages
                  .flat()
                  .filter((run) => String(run.id) !== String(context.runId))
                  .map((run) => [run.id, run]),
              ).values(),
            ];

            let recent = 0;
            for (const run of runs) {
              // admission 成功、排队或运行中都代表名额已被预留；跳过、非法配置
              // 和超额拒绝不会留下这些状态，不能仅凭 workflow run 存在就计入额度。
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              if (
                jobs.some(
                  (job) =>
                    job.name === "admission" &&
                    (job.conclusion === "success" ||
                      (job.conclusion == null &&
                        (job.status === "queued" || job.status === "in_progress"))),
                )
              ) {
                recent += 1;
              }
              if (recent >= limit) break;
            }

            core.notice(
              `Issue AI runs in the last 24 hours: ${recent} (limit ${limit})`,
            );
            if (recent >= limit) {
              core.setOutput("allow", "false");
              core.setFailed("Issue AI rolling quota exceeded");
              return;
            }

            core.setOutput("allow", "true");

  auto-triage:
    needs: admission
    if: >
      needs.admission.result == 'success' &&
      needs.admission.outputs.allow == 'true' &&
      needs.admission.outputs.mode == 'auto'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: issue-ai-auto
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage trusted Issue AI files
        run: |
          cp .github/scripts/issue-ai.mjs "$RUNNER_TEMP/issue-ai.mjs"
          cp .github/issue-ai/auto-prompt.md "$RUNNER_TEMP/issue-ai-prompt.md"

      - name: Read GitHub context
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AI_CONTEXT_FILE: ${{ runner.temp }}/issue-ai-context.md
        run: node "$RUNNER_TEMP/issue-ai.mjs" context

      - name: Checkout analyzed revision
        if: steps.context.outputs.checkout_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}
          persist-credentials: false

      - name: Write OpenCode provider config
        env:
          ISSUE_TRIAGE_API_KEY: ${{ secrets.ISSUE_TRIAGE_API_KEY }}
          ISSUE_TRIAGE_BASE_URL: ${{ secrets.ISSUE_TRIAGE_BASE_URL }}
          ISSUE_TRIAGE_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
        run: |
          test -n "$ISSUE_TRIAGE_API_KEY"
          test -n "$ISSUE_TRIAGE_BASE_URL"
          test -n "$ISSUE_TRIAGE_MODEL"
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          jq -n \
            --arg base "$ISSUE_TRIAGE_BASE_URL" \
            --arg key "$ISSUE_TRIAGE_API_KEY" \
            --arg model "$ISSUE_TRIAGE_MODEL" \
            '{
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                "gateway": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Gateway",
                  "options": { "baseURL": $base, "apiKey": $key },
                  "models": { ($model): { "name": $model } }
                }
              }
            }' > "${XDG_CONFIG_HOME:-$HOME/.config}/opencode/opencode.json"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.3

      - name: Run OpenCode triage
        env:
          ISSUE_TRIAGE_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
          ISSUE_AI_CONTEXT_FILE: ${{ runner.temp }}/issue-ai-context.md
          ISSUE_AI_PROMPT_FILE: ${{ runner.temp }}/issue-ai-prompt.md
          ISSUE_AI_OUTPUT_FILE: ${{ runner.temp }}/issue-ai-output.ndjson
          OPENCODE_PERMISSION: '{"edit":"deny"}'
        run: |
          set +e
          env -u GITHUB_TOKEN -u GH_TOKEN \
            opencode run \
              --format json \
              --model "gateway/${ISSUE_TRIAGE_MODEL}" \
              --file "$ISSUE_AI_CONTEXT_FILE" \
              < "$ISSUE_AI_PROMPT_FILE" \
              > "$ISSUE_AI_OUTPUT_FILE"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::OpenCode exited with status $status"
            exit "$status"
          fi

      - name: Publish OpenCode result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AI_OUTPUT_FILE: ${{ runner.temp }}/issue-ai-output.ndjson
        run: node "$RUNNER_TEMP/issue-ai.mjs" comment

  manual:
    needs: admission
    if: >
      needs.admission.result == 'success' &&
      needs.admission.outputs.allow == 'true' &&
      needs.admission.outputs.mode == 'manual'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: issue-ai-manual-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage trusted Issue AI files
        run: |
          cp .github/scripts/issue-ai.mjs "$RUNNER_TEMP/issue-ai.mjs"
          cp .github/issue-ai/manual-prompt.md "$RUNNER_TEMP/issue-ai-prompt.md"

      - name: Read GitHub context
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AI_CONTEXT_FILE: ${{ runner.temp }}/issue-ai-context.md
        run: node "$RUNNER_TEMP/issue-ai.mjs" context

      - name: Checkout analyzed revision
        if: steps.context.outputs.checkout_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}
          persist-credentials: false

      - name: Write OpenCode provider config
        env:
          ISSUE_TRIAGE_API_KEY: ${{ secrets.ISSUE_TRIAGE_API_KEY }}
          ISSUE_TRIAGE_BASE_URL: ${{ secrets.ISSUE_TRIAGE_BASE_URL }}
          ISSUE_TRIAGE_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
        run: |
          test -n "$ISSUE_TRIAGE_API_KEY"
          test -n "$ISSUE_TRIAGE_BASE_URL"
          test -n "$ISSUE_TRIAGE_MODEL"
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          jq -n \
            --arg base "$ISSUE_TRIAGE_BASE_URL" \
            --arg key "$ISSUE_TRIAGE_API_KEY" \
            --arg model "$ISSUE_TRIAGE_MODEL" \
            '{
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                "gateway": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Gateway",
                  "options": { "baseURL": $base, "apiKey": $key },
                  "models": { ($model): { "name": $model } }
                }
              }
            }' > "${XDG_CONFIG_HOME:-$HOME/.config}/opencode/opencode.json"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.3

      - name: Run OpenCode investigation
        env:
          ISSUE_TRIAGE_MODEL: ${{ secrets.ISSUE_TRIAGE_MODEL }}
          ISSUE_AI_CONTEXT_FILE: ${{ runner.temp }}/issue-ai-context.md
          ISSUE_AI_PROMPT_FILE: ${{ runner.temp }}/issue-ai-prompt.md
          ISSUE_AI_OUTPUT_FILE: ${{ runner.temp }}/issue-ai-output.ndjson
          OPENCODE_PERMISSION: '{"edit":"deny"}'
        run: |
          set +e
          env -u GITHUB_TOKEN -u GH_TOKEN \
            opencode run \
              --format json \
              --model "gateway/${ISSUE_TRIAGE_MODEL}" \
              --file "$ISSUE_AI_CONTEXT_FILE" \
              < "$ISSUE_AI_PROMPT_FILE" \
              > "$ISSUE_AI_OUTPUT_FILE"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::OpenCode exited with status $status"
            exit "$status"
          fi

      - name: Publish OpenCode result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AI_OUTPUT_FILE: ${{ runner.temp }}/issue-ai-output.ndjson
        run: node "$RUNNER_TEMP/issue-ai.mjs" comment
